services:
  # PostgreSQL database service (managed by Render)
  - type: pgsql
    name: ecolestrack-db
    plan: standard
    database: postgres
    user: postgres
    # ipAllowList can be removed; Render handles internal networking

  # Web API service
  - type: web
    name: ecolestrack-api
    env: node
    plan: standard
    # Build configuration (optional type check)
    buildCommand: npm run lint
    startCommand: npm run server
    
    # Depend on the database service to ensure it starts first
    dependsOn:
      - ecolestrack-db
    
    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production
      
      # PostgreSQL connection string from the pgsql service
      # Render automatically injects this when services are linked
      - key: DATABASE_URL
        fromService:
          type: pgsql
          name: ecolestrack-db
          property: connectionString
      
      # FedaPay configuration
      - key: FEDAPAY_WEBHOOK_URL
        fromService:
          type: web
          property: url
          suffixPath: /api/fedapay/webhook
